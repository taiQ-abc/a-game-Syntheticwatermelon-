<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>合成大西瓜 · 迷你版</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%;
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #f7e9c8;
    overflow: hidden;
    user-select: none;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 50% 0%, #fff6e0 0%, #f7e9c8 40%, #f0d9a8 100%);
  }

  .hud {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 56px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 18px;
    z-index: 20;
    pointer-events: none;
  }
  .score-box {
    background: rgba(255,255,255,.75);
    backdrop-filter: blur(6px);
    border: 1px solid rgba(200,160,100,.35);
    border-radius: 14px;
    padding: 7px 16px;
    display: flex;
    align-items: baseline;
    gap: 8px;
    box-shadow: 0 4px 14px rgba(160,120,60,.15);
    pointer-events: auto;
  }
  .score-label { font-size: 11px; color: #a08050; letter-spacing: 0.1em; }
  .score-value { font-size: 22px; font-weight: 800; color: #c06030; font-variant-numeric: tabular-nums; transition: transform 0.15s; }
  .score-value.bump { transform: scale(1.25); }

  .next-box {
    background: rgba(255,255,255,.75);
    backdrop-filter: blur(6px);
    border: 1px solid rgba(200,160,100,.35);
    border-radius: 14px;
    padding: 6px 12px;
    display: flex;
    align-items: center;
    gap: 8px;
    box-shadow: 0 4px 14px rgba(160,120,60,.15);
    pointer-events: auto;
  }
  .next-label { font-size: 11px; color: #a08050; letter-spacing: 0.1em; }
  .next-fruit { width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; }

  #gameWrap {
    position: relative;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 20px 50px rgba(160,120,60,.35), inset 0 0 0 1px rgba(255,255,255,.5);
  }
  canvas { display: block; cursor: pointer; touch-action: none; }

  .danger-line {
    position: absolute;
    left: 0; right: 0;
    height: 2px;
    background: repeating-linear-gradient(90deg, rgba(224,80,80,.5) 0, rgba(224,80,80,.5) 8px, transparent 8px, transparent 16px);
    z-index: 5;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.3s;
  }
  .danger-line.show { opacity: 1; }

  .overlay {
    position: absolute;
    inset: 0;
    background: rgba(247,233,200,.9);
    backdrop-filter: blur(8px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 30;
    padding: 20px;
    text-align: center;
    transition: opacity 0.4s;
  }
  .overlay.hidden { opacity: 0; pointer-events: none; }
  .overlay h1 {
    font-size: 24px;
    color: #c06030;
    margin-bottom: 8px;
    letter-spacing: 0.05em;
    text-shadow: 2px 2px 0 rgba(255,255,255,.8);
  }
  .overlay .sub {
    font-size: 12px;
    color: #a08050;
    margin-bottom: 20px;
    line-height: 1.6;
  }
  .fruit-row {
    display: flex;
    gap: 2px;
    margin-bottom: 20px;
    flex-wrap: wrap;
    justify-content: center;
    max-width: 200px;
  }
  .fruit-row span { font-size: 18px; animation: bounceIn 0.5s ease backwards; }
  @keyframes bounceIn {
    from { transform: scale(0) rotate(-180deg); opacity: 0; }
    to { transform: scale(1) rotate(0); opacity: 1; }
  }
  .start-btn {
    padding: 12px 36px;
    font-size: 16px;
    font-weight: 700;
    font-family: inherit;
    color: #fff;
    background: linear-gradient(135deg, #f09050, #e06030);
    border: none;
    border-radius: 30px;
    cursor: pointer;
    letter-spacing: 0.1em;
    box-shadow: 0 6px 20px rgba(224,96,48,.4);
    transition: all 0.2s;
  }
  .start-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 25px rgba(224,96,48,.5); }
  .start-btn:active { transform: translateY(0) scale(.97); }

  .final-score {
    font-size: 36px;
    font-weight: 800;
    color: #c06030;
    margin: 8px 0 4px;
    font-variant-numeric: tabular-nums;
  }
  .final-label { font-size: 12px; color: #a08050; margin-bottom: 20px; }

  .best-tag {
    font-size: 11px;
    color: #fff;
    background: #e8b04b;
    padding: 3px 10px;
    border-radius: 8px;
    margin-bottom: 16px;
  }

  .hint-bar {
    position: fixed;
    bottom: 14px;
    font-size: 11px;
    color: #a08050;
    letter-spacing: 0.05em;
    opacity: 0.7;
    pointer-events: none;
    text-align: center;
    width: 100%;
  }

  .pop-score {
    position: absolute;
    font-size: 16px;
    font-weight: 800;
    color: #e06030;
    pointer-events: none;
    z-index: 15;
    animation: popUp 0.7s ease-out forwards;
    text-shadow: 0 1px 3px rgba(255,255,255,.8);
  }
  @keyframes popUp {
    0% { transform: translate(-50%, 0) scale(0.5); opacity: 0; }
    30% { transform: translate(-50%, -10px) scale(1.2); opacity: 1; }
    100% { transform: translate(-50%, -36px) scale(1); opacity: 0; }
  }

  @media (max-width: 520px) {
    .overlay h1 { font-size: 22px; }
    .start-btn { padding: 10px 32px; font-size: 15px; }
    .score-value { font-size: 19px; }
    .hud { height: 50px; padding: 0 12px; }
  }
</style>
</head>
<body>

<div class="hud">
  <div class="score-box">
    <span class="score-label">得分</span>
    <span class="score-value" id="scoreDisplay">0</span>
  </div>
  <div class="next-box">
    <span class="next-label">下一个</span>
    <div class="next-fruit" id="nextFruitDisplay"></div>
  </div>
</div>

<div id="gameWrap">
  <canvas id="gameCanvas"></canvas>
  <div class="danger-line" id="dangerLine"></div>

  <div class="overlay" id="startOverlay">
    <h1>合成大西瓜</h1>
    <div class="sub">点击投放水果，相同水果碰撞合成更大的水果<br>合成大西瓜，挑战最高分！</div>
    <div class="fruit-row" id="fruitShowcase"></div>
    <button class="start-btn" id="startBtn">开始游戏</button>
  </div>

  <div class="overlay hidden" id="gameOverOverlay">
    <h1>游戏结束</h1>
    <div class="best-tag" id="bestTag">最高纪录：0</div>
    <div class="final-score" id="finalScore">0</div>
    <div class="final-label">本局得分</div>
    <button class="start-btn" id="restartBtn">再来一局</button>
  </div>
</div>

<div class="hint-bar">点击 / 触摸画布投放水果 · 越线将触发倒计时</div>

<script>
/* ============================================================
   水果配置（前6种直径缩小为原来的 4/5，西瓜保持半径 90）
   ============================================================ */
const FRUITS = [
  { name: '樱桃',   emoji: '🍒', color: '#d63c3c', color2: '#8a1e1e', radius: 13, score: 1 },
  { name: '橘子',   emoji: '🍊', color: '#f09030', color2: '#c06010', radius: 19, score: 3 },
  { name: '草莓',   emoji: '🍓', color: '#e8506a', color2: '#a01e3c', radius: 27, score: 6 },
  { name: '柿子',   emoji: '🍑', color: '#f07050', color2: '#c04020', radius: 36, score: 10 },
  { name: '苹果',   emoji: '🍎', color: '#e83c3c', color2: '#a01010', radius: 46, score: 15 },
  { name: '梨',     emoji: '🍐', color: '#c8d840', color2: '#88a010', radius: 58, score: 21 },
  { name: '西瓜',   emoji: '🍉', color: '#4cc85c', color2: '#207830', radius: 90, score: 30 }
];

// 初始只随机掉落前 3 种（樱桃、橘子、草莓）
const SPAWN_MAX_LEVEL = 2;

/* ============================================================
   物理引擎常量
   ============================================================ */
const GRAVITY = 0.6;             
const RESTITUTION = 0.15;        
const FRICTION = 0.08;           
const AIR_DRAG = 0.985;          
const WALL_RESTITUTION = 0.2;    
const SUBSTEPS = 4;              
const ITERATIONS = 10;           // 高迭代，消除穿模
const MERGE_TOLERANCE = 1.2;     // 稍微减小容差，适应更小尺寸
const MAX_ROTATION_SPEED = 0.1;  // 限制最大角速度

class Fruit {
  constructor(x, y, level) {
    this.x = x;
    this.y = y;
    this.vx = 0;
    this.vy = 0;
    this.level = level;
    this.radius = FRUITS[level].radius;
    this.mass = this.radius * this.radius; 
    this.inertia = 0.5 * this.mass * this.radius * this.radius; 
    this.merged = false;
    this.spawnTime = performance.now();
    this.rotation = 0;          
    this.rotationSpeed = 0; 
  }

  get mergeRadius() {
    return this.radius + MERGE_TOLERANCE;
  }
}

class Game {
  constructor(canvas) {
    this.canvas = canvas;
    this.ctx = canvas.getContext('2d');
    this.dpr = Math.min(window.devicePixelRatio || 1, 2);
    
    this.W = 216;
    this.H = 360;
    this.wallThickness = 6;

    this.fruits = [];
    this.score = 0;
    this.best = parseInt(localStorage.getItem('watermelon_best') || '0', 10);
    this.currentLevel = this.randomLevel();
    this.nextLevel = this.randomLevel();
    this.dropX = this.W / 2;
    this.canDrop = true;
    this.dropCooldown = 0;
    this.isRunning = false;
    this.isGameOver = false;
    
    this.dangerLineY = 52;
    this.dangerActive = false;
    this.countdown = -1;       
    
    this.particles = [];
    this.shake = 0;

    this.resize();
    this.bindEvents();
  }

  randomLevel() {
    return Math.floor(Math.random() * (SPAWN_MAX_LEVEL + 1));
  }

  resize() {
    const maxW = Math.min(window.innerWidth - 24, 260);
    const maxH = window.innerHeight - 110;
    let scale = Math.min(maxW / this.W, maxH / this.H);
    scale = Math.min(scale, 1.2);
    scale = Math.max(scale, 0.6);

    const dispW = Math.floor(this.W * scale);
    const dispH = Math.floor(this.H * scale);

    this.canvas.style.width = dispW + 'px';
    this.canvas.style.height = dispH + 'px';
    this.canvas.width = dispW * this.dpr;
    this.canvas.height = dispH * this.dpr;
    this.scale = scale;
    this.ctx.setTransform(this.dpr * scale, 0, 0, this.dpr * scale, 0, 0);

    const dl = document.getElementById('dangerLine');
    dl.style.top = (this.dangerLineY * scale) + 'px';
  }

  bindEvents() {
    const handler = (clientX) => {
      if (!this.isRunning || this.isGameOver) return;
      const rect = this.canvas.getBoundingClientRect();
      const x = (clientX - rect.left) / this.scale;
      this.dropX = Math.max(
        FRUITS[this.currentLevel].radius + this.wallThickness,
        Math.min(this.W - FRUITS[this.currentLevel].radius - this.wallThickness, x)
      );
    };

    this.canvas.addEventListener('mousemove', (e) => {
      if (!this.isRunning || this.isGameOver) return;
      handler(e.clientX);
    });

    this.canvas.addEventListener('click', (e) => {
      if (!this.isRunning || this.isGameOver) return;
      handler(e.clientX);
      this.drop();
    });

    this.canvas.addEventListener('touchstart', (e) => {
      if (!this.isRunning || this.isGameOver) return;
      handler(e.touches[0].clientX);
    }, { passive: true });

    this.canvas.addEventListener('touchmove', (e) => {
      if (!this.isRunning || this.isGameOver) return;
      handler(e.touches[0].clientX);
      e.preventDefault();
    }, { passive: false });

    this.canvas.addEventListener('touchend', (e) => {
      if (!this.isRunning || this.isGameOver) return;
      this.drop();
      e.preventDefault();
    }, { passive: false });

    window.addEventListener('resize', () => this.resize());
  }

  start() {
    this.fruits = [];
    this.score = 0;
    this.updateScoreDisplay();
    this.currentLevel = this.randomLevel();
    this.nextLevel = this.randomLevel();
    this.dropX = this.W / 2;
    this.canDrop = true;
    this.dropCooldown = 0;
    this.isRunning = true;
    this.isGameOver = false;
    this.dangerActive = false;
    this.countdown = -1;
    this.particles = [];
    this.shake = 0;
    this.updateNextDisplay();
    document.getElementById('dangerLine').classList.remove('show');
  }

  drop() {
    if (!this.canDrop || !this.isRunning || this.isGameOver) return;
    const level = this.currentLevel;
    const r = FRUITS[level].radius;
    const x = this.dropX;
    const y = this.wallThickness + r + 2;

    this.fruits.push(new Fruit(x, y, level));

    this.currentLevel = this.nextLevel;
    this.nextLevel = this.randomLevel();
    this.updateNextDisplay();

    this.canDrop = false;
    this.dropCooldown = 20;
  }

  updateNextDisplay() {
    const el = document.getElementById('nextFruitDisplay');
    const fruit = FRUITS[this.nextLevel];
    const r = Math.min(fruit.radius, 20);
    el.innerHTML = `<div style="width:${r*2}px;height:${r*2}px;border-radius:50%;background:radial-gradient(circle at 35% 30%, ${fruit.color}, ${fruit.color2});display:flex;align-items:center;justify-content:center;font-size:${r}px;line-height:1;box-shadow:inset -2px -2px 6px rgba(0,0,0,.15);">${fruit.emoji}</div>`;
  }

  updateScoreDisplay() {
    const el = document.getElementById('scoreDisplay');
    el.textContent = this.score;
    el.classList.add('bump');
    setTimeout(() => el.classList.remove('bump'), 150);
  }

  addScore(n, x, y) {
    this.score += n;
    this.updateScoreDisplay();
    const wrap = document.getElementById('gameWrap');
    const pop = document.createElement('div');
    pop.className = 'pop-score';
    pop.textContent = '+' + n;
    pop.style.left = (x * this.scale) + 'px';
    pop.style.top = (y * this.scale) + 'px';
    wrap.appendChild(pop);
    setTimeout(() => pop.remove(), 700);
  }

  update() {
    if (!this.isRunning || this.isGameOver) return;

    if (this.dropCooldown > 0) this.dropCooldown--;
    if (this.dropCooldown === 0) this.canDrop = true;

    for (let s = 0; s < SUBSTEPS; s++) {
      this.physicsStep(1 / SUBSTEPS);
    }

    this.handleMerges();
    this.fruits = this.fruits.filter(f => !f.merged);
    this.updateParticles();
    if (this.shake > 0) this.shake *= 0.9;

    this.checkDanger();
    
    if (this.dangerActive) {
      if (this.countdown < 0) this.countdown = 3.0;
      this.countdown -= 1/60;
      if (this.countdown <= 0) {
        this.gameOver();
      }
    } else {
      this.countdown = -1;
    }
  }

  physicsStep(dt) {
    const fruits = this.fruits;
    const wall = this.wallThickness;
    const maxLevel = FRUITS.length - 1;

    for (const f of fruits) {
      if (f.merged) continue;
      f.vy += GRAVITY * dt * SUBSTEPS;
      f.vx *= AIR_DRAG;
      f.vy *= AIR_DRAG;
      
      f.x += f.vx * dt * SUBSTEPS * 2;
      f.y += f.vy * dt * SUBSTEPS * 2;
      
      f.rotation += f.rotationSpeed;
    }

    for (let iter = 0; iter < ITERATIONS; iter++) {
      
      for (let i = 0; i < fruits.length; i++) {
        const a = fruits[i];
        if (a.merged) continue;
        for (let j = i + 1; j < fruits.length; j++) {
          const b = fruits[j];
          if (b.merged) continue;

          const dx = b.x - a.x;
          const dy = b.y - a.y;
          const distSq = dx * dx + dy * dy;
          const minDist = a.radius + b.radius;

          if (distSq < minDist * minDist && distSq > 0.001) {
            const dist = Math.sqrt(distSq);
            const overlap = minDist - dist;
            const nx = dx / dist;
            const ny = dy / dist;

            if (a.level === b.level && a.level < maxLevel) continue;

            const totalMass = a.mass + b.mass;
            const aMove = b.mass / totalMass;
            const bMove = a.mass / totalMass;

            const correction = overlap * 0.9;
            a.x -= nx * correction * aMove;
            a.y -= ny * correction * aMove;
            b.x += nx * correction * bMove;
            b.y += ny * correction * bMove;

            const rvx = b.vx - a.vx;
            const rvy = b.vy - a.vy;
            const velAlongNormal = rvx * nx + rvy * ny;

            if (velAlongNormal < 0) {
              const e = RESTITUTION;
              const jImp = -(1 + e) * velAlongNormal / (1 / a.mass + 1 / b.mass);
              const impulseX = jImp * nx;
              const impulseY = jImp * ny;

              a.vx -= impulseX / a.mass;
              a.vy -= impulseY / a.mass;
              b.vx += impulseX / b.mass;
              b.vy += impulseY / b.mass;

              const tx = -ny, ty = nx;
              const velTangent = rvx * tx + rvy * ty;
              
              if (Math.abs(velTangent) > 0.01) {
                const jTangent = -velTangent * FRICTION / (1 / a.mass + 1 / b.mass);
                
                a.vx -= jTangent * tx / a.mass;
                a.vy -= jTangent * ty / a.mass;
                b.vx += jTangent * tx / b.mass;
                b.vy += jTangent * ty / b.mass;

                a.rotationSpeed -= (jTangent * a.radius) / a.inertia;
                b.rotationSpeed += (jTangent * b.radius) / b.inertia;
                
                a.rotationSpeed = Math.max(-MAX_ROTATION_SPEED, Math.min(MAX_ROTATION_SPEED, a.rotationSpeed));
                b.rotationSpeed = Math.max(-MAX_ROTATION_SPEED, Math.min(MAX_ROTATION_SPEED, b.rotationSpeed));
              }
            }
          }
        }
      }

      for (const f of fruits) {
        if (f.merged) continue;
        if (f.x - f.radius < wall) {
          f.x = wall + f.radius;
          if (f.vx < 0) f.vx = -f.vx * WALL_RESTITUTION;
        }
        if (f.x + f.radius > this.W - wall) {
          f.x = this.W - wall - f.radius;
          if (f.vx > 0) f.vx = -f.vx * WALL_RESTITUTION;
        }
        if (f.y + f.radius > this.H - wall) {
          f.y = this.H - wall - f.radius;
          if (f.vy > 0) {
            f.vy = -f.vy * RESTITUTION;
            if (Math.abs(f.vy) < 0.3) f.vy = 0;
          }
        }
        if (f.y - f.radius < 0) {
          f.y = f.radius;
          if (f.vy < 0) f.vy = 0;
        }
      }
    }

    for (const f of fruits) {
      if (f.merged) continue;
      f.rotationSpeed *= 0.98;
      if (Math.abs(f.vx) < 0.1 && Math.abs(f.vy) < 0.1) {
        f.rotationSpeed *= 0.8;
        if (Math.abs(f.rotationSpeed) < 0.001) f.rotationSpeed = 0;
      }
    }
  }

  handleMerges() {
    const fruits = this.fruits;
    const merges = [];
    const maxLevel = FRUITS.length - 1;

    for (let i = 0; i < fruits.length; i++) {
      const a = fruits[i];
      if (a.merged) continue;
      for (let j = i + 1; j < fruits.length; j++) {
        const b = fruits[j];
        if (b.merged) continue;
        if (a.level !== b.level) continue;
        if (a.level >= maxLevel) continue;

        const dx = b.x - a.x;
        const dy = b.y - a.y;
        const distSq = dx * dx + dy * dy;
        const mergeDist = a.radius + b.radius + MERGE_TOLERANCE;

        if (distSq <= mergeDist * mergeDist) {
          merges.push([a, b]);
          a.merged = true;
          b.merged = true;
        }
      }
    }

    for (const [a, b] of merges) {
      const newLevel = a.level + 1;
      const newX = (a.x + b.x) / 2;
      const newY = (a.y + b.y) / 2;
      const newFruit = new Fruit(newX, newY, newLevel);
      newFruit.vx = (a.vx + b.vx) / 2;
      newFruit.vy = (a.vy + b.vy) / 2 - 1.2;
      newFruit.rotationSpeed = (a.rotationSpeed + b.rotationSpeed) / 2;
      this.fruits.push(newFruit);

      this.addScore(FRUITS[newLevel].score, newX, newY);
      this.spawnParticles(newX, newY, FRUITS[newLevel].color, newLevel);
      this.shake = Math.min(this.shake + 2 + newLevel * 0.5, 6);
      playMergeSound(newLevel);
    }
  }

  spawnParticles(x, y, color, level) {
    const count = 6 + level * 2;
    for (let i = 0; i < count; i++) {
      const angle = (Math.PI * 2 * i) / count + Math.random() * 0.3;
      const speed = 1.5 + Math.random() * 2.5 + level * 0.2;
      this.particles.push({
        x, y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed - 1,
        life: 1,
        color,
        size: 1.5 + Math.random() * 2
      });
    }
  }

  updateParticles() {
    for (const p of this.particles) {
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.15;
      p.vx *= 0.97;
      p.life -= 0.025;
    }
    this.particles = this.particles.filter(p => p.life > 0);
  }

  checkDanger() {
    let danger = false;
    const lineY = this.dangerLineY;
    const now = performance.now();
    for (const f of this.fruits) {
      if (f.merged) continue;
      if (now - f.spawnTime < 800) continue;
      if (f.y - f.radius < lineY && Math.abs(f.vy) < 1.5) {
        danger = true;
        break;
      }
    }

    if (danger !== this.dangerActive) {
      this.dangerActive = danger;
      document.getElementById('dangerLine').classList.toggle('show', danger);
    }
  }

  gameOver() {
    if (this.isGameOver) return;
    this.isGameOver = true;
    this.isRunning = false;
    playGameOverSound();

    if (this.score > this.best) {
      this.best = this.score;
      localStorage.setItem('watermelon_best', this.best);
    }

    document.getElementById('finalScore').textContent = this.score;
    document.getElementById('bestTag').textContent = '最高纪录：' + this.best;
    document.getElementById('gameOverOverlay').classList.remove('hidden');
  }

  render() {
    const ctx = this.ctx;
    const W = this.W, H = this.H, wall = this.wallThickness;

    ctx.save();
    if (this.shake > 0.1) {
      ctx.translate((Math.random() - 0.5) * this.shake, (Math.random() - 0.5) * this.shake);
    }

    const grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, '#fdf5e0');
    grad.addColorStop(1, '#f8e8c0');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    if (this.dangerActive) {
      ctx.save();
      ctx.fillStyle = 'rgba(224,80,80,0.08)';
      ctx.fillRect(0, 0, W, this.dangerLineY);
      ctx.restore();
    } else {
      ctx.save();
      ctx.fillStyle = 'rgba(224,80,80,0.02)';
      ctx.fillRect(0, 0, W, this.dangerLineY);
      ctx.restore();
    }

    ctx.fillStyle = 'rgba(200,170,120,.35)';
    ctx.fillRect(0, 0, wall, H);
    ctx.fillRect(W - wall, 0, wall, H);
    ctx.fillRect(0, H - wall, W, wall);

    ctx.strokeStyle = 'rgba(255,255,255,.5)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(wall + 0.5, 0);
    ctx.lineTo(wall + 0.5, H);
    ctx.moveTo(W - wall - 0.5, 0);
    ctx.lineTo(W - wall - 0.5, H);
    ctx.stroke();

    if (this.dangerActive) {
      ctx.save();
      ctx.strokeStyle = 'rgba(224,80,80,' + (0.4 + Math.sin(performance.now() / 100) * 0.3) + ')';
      ctx.lineWidth = 2;
      ctx.setLineDash([8, 8]);
      ctx.beginPath();
      ctx.moveTo(wall, this.dangerLineY);
      ctx.lineTo(W - wall, this.dangerLineY);
      ctx.stroke();
      ctx.restore();
    }

    if (this.isRunning && !this.isGameOver && this.canDrop) {
      const level = this.currentLevel;
      const r = FRUITS[level].radius;
      const x = this.dropX;
      const y = this.wallThickness + r + 2;

      ctx.save();
      ctx.strokeStyle = 'rgba(224,96,48,.2)';
      ctx.lineWidth = 1.5;
      ctx.setLineDash([4, 6]);
      ctx.beginPath();
      ctx.moveTo(x, y + r);
      ctx.lineTo(x, H - wall);
      ctx.stroke();
      ctx.restore();

      ctx.save();
      ctx.globalAlpha = 0.6;
      this.drawFruitShape(ctx, x, y, r, level, 0);
      ctx.restore();
    }

    for (const f of this.fruits) {
      if (f.merged) continue;
      this.drawFruitShape(ctx, f.x, f.y, f.radius, f.level, f.rotation);
    }

    for (const p of this.particles) {
      ctx.save();
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    if (this.countdown > 0) {
      ctx.save();
      ctx.fillStyle = 'rgba(224, 80, 80, 0.85)';
      ctx.font = 'bold 48px "PingFang SC", "Microsoft YaHei", sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      const shakeX = (Math.random() - 0.5) * 4;
      const shakeY = (Math.random() - 0.5) * 4;
      ctx.fillText(Math.ceil(this.countdown), W / 2 + shakeX, H / 2 + shakeY);
      ctx.restore();
    }

    ctx.restore();
  }

  drawFruitShape(ctx, x, y, r, level, rotation) {
    const fruit = FRUITS[level];
    ctx.save();
    ctx.translate(x, y);

    ctx.save();
    ctx.shadowColor = 'rgba(120,80,40,.25)';
    ctx.shadowBlur = r * 0.25;
    ctx.shadowOffsetY = r * 0.12;

    const grad = ctx.createRadialGradient(-r * 0.35, -r * 0.35, r * 0.1, 0, 0, r);
    grad.addColorStop(0, lighten(fruit.color, 30));
    grad.addColorStop(0.5, fruit.color);
    grad.addColorStop(1, fruit.color2);

    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(0, 0, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    ctx.strokeStyle = 'rgba(0,0,0,.08)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(0, 0, r, 0, Math.PI * 2);
    ctx.stroke();

    ctx.save();
    const hl = ctx.createRadialGradient(-r * 0.35, -r * 0.4, 0, -r * 0.35, -r * 0.4, r * 0.7);
    hl.addColorStop(0, 'rgba(255,255,255,.55)');
    hl.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = hl;
    ctx.beginPath();
    ctx.arc(0, 0, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    ctx.save();
    ctx.rotate(rotation);
    ctx.font = `${r * 1.1}px "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.globalAlpha = 0.95;
    ctx.fillText(fruit.emoji, 0, r * 0.05);
    ctx.restore();

    ctx.restore();
  }

  loop() {
    this.update();
    this.render();
    requestAnimationFrame(() => this.loop());
  }
}

function lighten(hex, amount) {
  const num = parseInt(hex.replace('#', ''), 16);
  let r = (num >> 16) + amount;
  let g = ((num >> 8) & 0xff) + amount;
  let b = (num & 0xff) + amount;
  r = Math.min(255, Math.max(0, r));
  g = Math.min(255, Math.max(0, g));
  b = Math.min(255, Math.max(0, b));
  return '#' + ((r << 16) | (g << 8) | b).toString(16).padStart(6, '0');
}

let audioCtx = null;
function initAudio() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
  }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}

function playMergeSound(level) {
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  const baseFreq = 300 + level * 80;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(baseFreq, t);
  osc.frequency.exponentialRampToValueAtTime(baseFreq * 1.5, t + 0.1);
  gain.gain.setValueAtTime(0.12, t);
  gain.gain.exponentialRampToValueAtTime(0.001, t + 0.2);
  osc.connect(gain).connect(audioCtx.destination);
  osc.start(t);
  osc.stop(t + 0.22);
}

function playGameOverSound() {
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  [392, 349, 293, 220].forEach((freq, i) => {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'triangle';
    osc.frequency.value = freq;
    const start = t + i * 0.12;
    gain.gain.setValueAtTime(0, start);
    gain.gain.linearRampToValueAtTime(0.1, start + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.001, start + 0.3);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(start);
    osc.stop(start + 0.32);
  });
}

const canvas = document.getElementById('gameCanvas');
const game = new Game(canvas);
game.loop();

(function initShowcase() {
  const row = document.getElementById('fruitShowcase');
  FRUITS.forEach((f, i) => {
    const span = document.createElement('span');
    span.textContent = f.emoji;
    span.style.animationDelay = (i * 0.06) + 's';
    row.appendChild(span);
  });
})();

game.updateNextDisplay();
game.updateScoreDisplay();

document.getElementById('startBtn').addEventListener('click', () => {
  initAudio();
  document.getElementById('startOverlay').classList.add('hidden');
  game.start();
});

document.getElementById('restartBtn').addEventListener('click', () => {
  initAudio();
  document.getElementById('gameOverOverlay').classList.add('hidden');
  game.start();
});

document.addEventListener('click', function once() {
  initAudio();
  document.removeEventListener('click', once);
}, { once: true });
</script>
